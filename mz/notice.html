<!DOCTYPE html>

<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<link href="css/notice.css?v=260917220253" rel="stylesheet"/>
<script src="../config/config.js?v=260917220253"></script>
<title>通知管理</title>
</head>
<body>
<div class="notice-container">
<div class="notice-header">
<a class="admin-menu-item" href="../index.html">首页</a>
      通知管理<a class="admin-menu-item" href="update.html">
        🔄 更新页面
      </a>
        <button class="header-btn" onclick="getNoticeDataALl()" type="button">获取所有</button>
        <button class="header-btn" onclick="addItem()" type="button">添加</button>
</div>
<div id="toastContainer"></div>
<div class="notice-list" id="noticeList">
<div class="loading-message">加载中...</div>
</div>
<!-- 自定义输入对话框 -->
<div class="custom-dialog" id="customInputDialog">
<div class="dialog-content">
<div class="dialog-header">
<h3 id="dialogTitle">输入内容</h3>
<button class="dialog-close" onclick="closeCustomDialog()">×</button>
</div>
<div class="dialog-body">
<textarea class="dialog-input" id="dialogInput" placeholder="请输入内容" rows="3"></textarea>
</div>
<div class="dialog-footer">
<button class="btn btn-cancel" onclick="closeCustomDialog()">取消</button>
<button class="btn btn-confirm" onclick="confirmCustomDialog()">确认</button>
</div>
</div>
</div>
</div>
<script src="js/notice.js?v=260917220253"></script>
</body>
</html>
