<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>lalala分享小屋</title>
    <style>
      :root {
        --my-font-size: 1em;
      }

      body {
        font-family: Arial, sans-serif;
        background-color: #E0F7FA;
        color: #212121;
        margin: 0;
        padding: 0;
        font-size: var(--my-font-size);
      }

      .container {
        padding: 11px
      }

      .btn-group {
        display: flex;
        justify-content: space-between;
        margin-bottom: 20px;
        gap: 10px;
      }

      .btn-range {
        font-size: 1em;
        padding: 8px 5px;
        border: 1px solid #ccc;
        background-color: transparent;
        color: #333;
        cursor: pointer;
        border-radius: 5px;
        transition: all 0.3s ease;
        flex: 1;
        text-align: center;
        white-space: nowrap;
      }

      .btn-range:hover,
      .btn-range:focus {
        background-color: #f0f0f0;
        outline: none;
      }

      .btn-layout {
        font-size: 1em;
        padding: 8px 5px;
        border: 1px solid #4CAF50;
        background-color: #4CAF50;
        color: white;
        cursor: pointer;
        border-radius: 5px;
        transition: all 0.3s ease;
        flex: 1;
        text-align: center;
        white-space: nowrap;
      }

      .btn-layout:hover,
      .btn-layout:focus {
        background-color: #45a049;
        outline: none;
      }

      .list-row {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        justify-content: center;
        margin-bottom: 2px;
      }

      .item {
        flex: 1 1 calc(50% - 10px);
        background-color: #ffffff;
        border-radius: 8px;
        padding: 7px;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        cursor: pointer;
        transition: background-color 0.3s ease;
        box-sizing: border-box;
      }

      .item:hover {
        background-color: #f0f0f0;
      }

      .text-part {
        font-size: 1em;
        color: #333;
        word-break: break-word;
      }

      .tatol {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        padding: 15px;
        border-radius: 5px;
        width: 80%;
        max-width: 400px;
        background: rgba(0, 0, 0, 0.8);
        color: #fff;
        z-index: 1000;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        text-align: center;
        font-size: 1em;
      }

      /* 单列模式 */
      .single-column .item {
        flex: 1 1 100%;
      }

      /* 桌面端调整按钮宽度 */
      @media (min-width: 601px) {
        .btn-layout {
          flex: 0.5;
        }
      }
    </style>
  </head>
  <body>

    <div class="container">
      <div class="btn-group">
        <button class="btn-range" onclick="showRange(1, 50)">1-50条</button>
        <button class="btn-range" onclick="showRange(51, 100)">51-100条</button>
        <button id="toggleLayoutBtn" class="btn-layout" onclick="toggleLayout()">单列显示</button>
      </div>
      <p>{1 第1条} {2-6 第2、3、4、5、6条} {空格分开}</p>
      <div class="btn-group">
        <input type="text" id="idFilterInput" class="btn-range" placeholder="输入编号筛选：如 1 10 2-6" oninput="filterById()">
      </div>
      <div id="listBox"></div>
    </div>

    <script>
      // 根据编号筛选
      function filterById() {
        const input = document.getElementById("idFilterInput").value.trim();
        if (!allData || allData.length === 0) return;

        if (!input) {
          // 输入为空时恢复当前范围的数据
          const rangeButtons = document.querySelectorAll(".btn-range");
          for (let btn of rangeButtons) {
            if (btn.textContent.includes("1-50")) {
              showRange(1, 50);
              break;
            } else if (btn.textContent.includes("51-100")) {
              showRange(51, 100);
              break;
            }
          }
          return;
        }

        const idsToInclude = new Set();

        const entries = input.split(/\s+/); // 分割空格
        entries.forEach(part => {
          if (/^\d+$/.test(part)) {
            // 单个数字，如 "1"
            idsToInclude.add(parseInt(part));
          } else if (/^\d+-\d+$/.test(part)) {
            // 范围，如 "2-6"
            const [startStr, endStr] = part.split('-');
            const start = parseInt(startStr);
            const end = parseInt(endStr);
            if (start <= end) {
              for (let i = start; i <= end; i++) {
                idsToInclude.add(i);
              }
            }
          }
        });

        const filtered = allData.filter(item => idsToInclude.has(parseInt(item.id)));
        renderData(filtered);
      }

      // 提示组件
      function tatol(status, text, timer = 1) {
        const toast = document.createElement("div");
        toast.className = "tatol";
        toast.innerHTML = `<div class="infoText">${text}</div>`;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), timer * 1000);
      }

      // 复制文本到剪贴板
      function copyTxt(number, text) {
        if (!document.execCommand) {
          tatol(1, "复制失败，请长按复制", 1);
          return;
        }
        const textarea = document.createElement("textarea");
        textarea.value = text;
        textarea.style.position = "fixed";
        textarea.style.opacity = 0;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand("copy");
        document.body.removeChild(textarea);
        tatol(0, "已复制第：" + number + " 条", 1);
      }

      let allData = [];
      let isSingleColumn = true;
      let isRequesting = false; // 请求节流标志
      const DATA_EXPIRY_TIME = 60 * 1000; // 1分钟过期时间

      // 渲染数据
      function renderData(data) {
        const container = document.getElementById("listBox");
        container.innerHTML = '';

        if (!data || data.length === 0) {
          container.innerHTML = `<p style="text-align:center;">暂无数据</p>`;
          return;
        }

        container.className = isSingleColumn ? 'single-column' : '';

        // 创建行和项目
        for (let i = 0; i < data.length; i++) {
          if (i % 2 === 0 || isSingleColumn) {
            const row = document.createElement('div');
            row.className = 'list-row';
            container.appendChild(row);
          }

          const lastRow = container.lastChild;
          const item = createItem(data[i]);
          lastRow.appendChild(item);
        }
      }

      // 创建单个条目
      function createItem(item) {
        const div = document.createElement('div');
        div.className = 'item';
        div.setAttribute('onclick', `copyTxt('${item.id}', '${item.context.replace(/'/g, "\\'")}')`);
        div.innerHTML = `<div class="text-part">${item.id}. ${item.context}</div>`;
        return div;
      }

      // 检查本地存储的数据是否有效
      function checkLocalData() {
        const savedData = localStorage.getItem('blessingData');
        const savedTime = localStorage.getItem('blessingDataTime');
        
        if (savedData && savedTime) {
          const currentTime = new Date().getTime();
          const timeDiff = currentTime - parseInt(savedTime);
          
          if (timeDiff < DATA_EXPIRY_TIME) {
            // 数据未过期，使用本地数据
            try {
              allData = JSON.parse(savedData);
              showRange(1, 50);
              return true;
            } catch (e) {
              console.error('解析本地数据失败', e);
              localStorage.removeItem('blessingData');
              localStorage.removeItem('blessingDataTime');
            }
          } else {
            // 数据已过期，清除
            localStorage.removeItem('blessingData');
            localStorage.removeItem('blessingDataTime');
          }
        }
        return false;
      }

      // 获取全部数据
      function loadData() {
        // 如果已经有数据，直接显示
        if (allData.length > 0) {
          showRange(1, 50);
          return;
        }
        
        // 检查本地存储
        if (checkLocalData()) {
          return;
        }

        // 防止重复请求
        if (isRequesting) {
          tatol(1, "正在加载数据，请稍候...", 1);
          return;
        }

        // 显示加载中状态
        const container = document.getElementById("listBox");
        container.innerHTML = '<p style="text-align:center;">加载中...</p>';

        isRequesting = true;
        
        const xhr = new XMLHttpRequest();
        const dev_url = "http://1.95.169.223";
        const text_url = "http://127.0.0.1:9112";
        xhr.open("GET", `${text_url}/fang3/zfy`);
        xhr.send();

        xhr.onreadystatechange = function() {
          if (xhr.readyState === 4) {
            isRequesting = false;
            
            if (xhr.status === 200) {
              try {
                const res = JSON.parse(xhr.responseText);
                allData = res.data || [];
                
                // 保存到本地存储
                localStorage.setItem('blessingData', JSON.stringify(allData));
                localStorage.setItem('blessingDataTime', new Date().getTime().toString());
                
                // 设置1分钟后清除数据
                setTimeout(() => {
                  localStorage.removeItem('blessingData');
                  localStorage.removeItem('blessingDataTime');
                }, DATA_EXPIRY_TIME);
                
                showRange(1, 50); // 数据加载完成后自动显示1-50条
              } catch (e) {
                tatol(1, "数据解析失败", 1);
                document.getElementById("listBox").innerHTML = '<p style="text-align:center;">数据加载失败</p>';
              }
            } else {
              tatol(1, "请求异常", 1);
              document.getElementById("listBox").innerHTML = '<p style="text-align:center;">网络请求失败</p>';
            }
          }
        };
      }

      // 显示指定范围的数据
      function showRange(start, end) {
        if (allData.length === 0) {
          tatol(1, "数据尚未加载完成", 1);
          return;
        }

        const filtered = allData.filter(item => {
          const id = parseInt(item.id);
          return id >= start && id <= end;
        });
        renderData(filtered);
      }

      // 切换布局
      function toggleLayout() {
        isSingleColumn = !isSingleColumn;
        const toggleBtn = document.getElementById('toggleLayoutBtn');
        toggleBtn.textContent = isSingleColumn ? '双列显示' : '单列显示';

        // 重新渲染当前显示的数据
        const container = document.getElementById('listBox');
        const items = container.querySelectorAll('.item');
        if (items.length > 0) {
          const currentData = Array.from(items).map(item => {
            const text = item.querySelector('.text-part').textContent;
            const [id, ...contextParts] = text.split('. ');
            return {
              id: id.replace('.', '').trim(),
              context: contextParts.join('. ')
            };
          });
          renderData(currentData);
        }
      }

      // 页面加载时直接加载数据
      window.onload = function () {
        // 初始化加载数据
        loadData();
        // 清空筛选输入框
        document.getElementById("idFilterInput").value = "";
      };
    </script>
  </body>
</html>
