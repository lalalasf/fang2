<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>祝福语</title>
  <style>
    :root {
      --my-font-size: 1em;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #E0F7FA;
      color: #212121;
      margin: 0;
      padding: 0;
      font-size: var(--my-font-size);
    }

    .container {
      padding: 20px;
    }

    .btn-group {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .btn-range {
      font-size: 1em;
      padding: 8px 16px;
      border: 1px solid #ccc;
      background-color: transparent;
      color: #333;
      cursor: pointer;
      border-radius: 5px;
      transition: all 0.3s ease;
    }

    .btn-range:hover,
    .btn-range:focus {
      background-color: #f0f0f0;
      outline: none;
    }

    .list-row {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      justify-content: center;
      margin-bottom: 10px;
    }

    .item {
      flex: 1 1 45%;
      max-width: 48%;
      background-color: #ffffff;
      border-radius: 8px;
      padding: 12px 16px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .item:hover {
      background-color: #f0f0f0;
    }

    .text-part {
      font-size: 1em;
      color: #333;
      word-break: break-word;
    }

    .tatol {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 15px;
      border-radius: 5px;
      width: 80%;
      max-width: 400px;
      background: rgba(0, 0, 0, 0.8);
      color: #fff;
      z-index: 1000;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      text-align: center;
      font-size: 1em;
    }

    /* 移动端适配：每行只显示一个条目 */
    @media (max-width: 600px) {
      .item {
        max-width: 95%;
        flex: 1 1 95%;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="btn-group">
    <button class="btn-range" onclick="showRange(1, 50)">1-50内容</button>
    <button class="btn-range" onclick="showRange(51, 100)">51-100内容</button>
  </div>
  <div id="listBox"></div>
</div>

<script>
  // 提示组件
  function tatol(status, text, timer = 1) {
    const toast = document.createElement("div");
    toast.className = "tatol";
    toast.innerHTML = `<div class="infoText">${text}</div>`;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), timer * 1000);
  }

  // 复制文本到剪贴板
  function copyTxt(number, text) {
    if (!document.execCommand) {
      tatol(1, "复制失败，请长按复制", 1);
      return;
    }
    const textarea = document.createElement("textarea");
    textarea.value = text;
    textarea.style.position = "fixed";
    textarea.style.opacity = 0;
    document.body.appendChild(textarea);
    textarea.select();
    document.execCommand("copy");
    document.body.removeChild(textarea);
    tatol(0, "已复制第：" + number + " 条", 1);
  }

  let allData = [];

  // 渲染数据
  function renderData(data) {
    const container = document.getElementById("listBox");
    container.innerHTML = ''; // 清空旧数据

    if (!data || data.length === 0) {
      container.innerHTML = `<p style="text-align:center;">暂无数据</p>`;
      return;
    }

    // 每行放两个 item
    for (let i = 0; i < data.length; i += 2) {
      const row = document.createElement('div');
      row.className = 'list-row';

      const item1 = createItem(data[i]);
      row.appendChild(item1);

      if (data[i + 1]) {
        const item2 = createItem(data[i + 1]);
        row.appendChild(item2);
      }

      container.appendChild(row);
    }
  }

  // 创建单个条目
  function createItem(item) {
    const div = document.createElement('div');
    div.className = 'item';
    div.setAttribute('onclick', `copyTxt('${item.id}', '${item.context.replace(/'/g, "\\'")}')`);
    div.innerHTML = `<div class="text-part">${item.id}. ${item.context}</div>`;
    return div;
  }

  // 获取全部数据
  function loadData() {
    if (allData.length > 0) {
      return;
    }

    const xhr = new XMLHttpRequest();
    const dev_url = "http://1.95.169.223";
    xhr.open("GET", `${dev_url}/fang3/zfy`);
    xhr.send();
    xhr.onreadystatechange = function () {
      if (xhr.readyState === 4 && xhr.status === 200) {
        const res = JSON.parse(xhr.responseText);
        allData = res.data || [];
      } else if (xhr.readyState === 4) {
        tatol(1, "请求异常", 1);
      }
    };
  }

  // 显示指定范围的数据
  function showRange(start, end) {
    if (allData.length === 0) {
      tatol(1, "请先加载数据", 1);
      return;
    }

    let filtered;

    if (start <= 50) {
      filtered = allData.filter(item => parseInt(item.id) >= start && parseInt(item.id) <= end);
    } else {
      filtered = allData.filter(item => parseInt(item.id) > 50 && parseInt(item.id) <= end);
    }

    renderData(filtered);
  }

  // 页面加载时请求数据
  window.onload = function () {
    loadData();
  };
</script>

</body>
</html>
