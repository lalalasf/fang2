<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>update</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 600px;
        margin: 0 auto;
        padding: 20px;
      }

      .container {
        display: flex;
        flex-direction: column;
        gap: 15px;
      }

      .input-group {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }

      label {
        font-weight: bold;
      }

      textarea,
      input {
        padding: 10px;
        font-size: 16px;
        border: 1px solid #ccc;
        border-radius: 4px;
      }

      textarea {
        height: 100px;
        resize: vertical;
      }

      button {
        padding: 10px 15px;
        background-color: #4CAF50;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 16px;
      }

      button:hover {
        background-color: #45a049;
      }

      #response {
        margin-top: 20px;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 4px;
        min-height: 50px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>更新祝福语</h1>

      <div class="input-group">
        <label for="contentInput">内容：</label>
        <textarea id="contentInput" placeholder="请输入内容..."></textarea>
      </div>

      <div class="input-group">
        <label for="tokenInput">Token：</label>
        <input type="text" id="tokenInput" value="">
      </div>

      <button id="sendButton">发送请求</button>
      <div id="response"></div>
    </div>
    <div>
      <p styel="margin-left:10px;">示例：</p>
      <p styel="margin-left:10px;"> 1.xxxx</p>
      <p styel="margin-left:10px;"> 2.xxxx </p>
      <p styel="margin-left:10px;"> ......</p>
      <p styel="margin-left:10px;"> 50.xxx </p>
    </div>

    <script>
      document.getElementById('sendButton').addEventListener('click', sendPostRequest);

      document.addEventListener("DOMContentLoaded", () => {
        document.getElementById("tokenInput").value = localStorage.getItem("token");
      });

      function sendPostRequest() {

        const content = document.getElementById('contentInput').value.trim();
        const token = document.getElementById('tokenInput').value.trim();
        const responseDiv = document.getElementById('response');


        console.log(token);

        if (!content) {
          responseDiv.innerHTML = "<p style='color:red'>请输入内容</p>";
          return;
        }

        if (!token) {
          responseDiv.innerHTML = "<p style='color:red'>请输入token</p>";
          return;
        }

        // 请求参数
        const requestData = {
          context: content,
          token: token
        };

        // API 端点
        const apiUrl_test = 'http://127.0.0.1:9112';
        const apiUrl_dev = 'http://127.0.0.1:9112';

        const apiUrlto = apiUrl_test + "/fang3/a/update";
        console.log(JSON.stringify(requestData));

        fetch(apiUrlto, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify(requestData)
          })
          .then(response => {
            // console.log(response)
            if (!response.ok) {
              throw new Error(`HTTP 错误！状态码: ${response.status}`);
            }
            return response.json();
          })
          .then(data => {
            localStorage.setItem("token", token);
            responseDiv.innerHTML = `<p style='color:green'>请求成功！</p><pre>${JSON.stringify(data, null, 2)}</pre>`;
          })
          .catch(error => {
            responseDiv.innerHTML = `<p style='color:red'>请求失败: ${error.message}</p>`;
            console.error('Error:', error);
          });

      }
    </script>
  </body>
</html>
