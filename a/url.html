<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IP/URL数据查询</title>
    <link rel="stylesheet" href="../css/url.css">
  </head>
  <body>
    <div id="authModal" class="auth-modal">
      <div class="auth-content">
        <h3>请输入Token</h3>
        <input id="tokenInput" type="password" placeholder="输入Token">
        <button onclick="checkToken()">验证</button>
        <div id="tokenError" class="error-message" style="display: none;">Token验证失败，请重新输入</div>
      </div>
    </div>

    <div id="mainContainer" class="container" style="display: none;">
      <div class="filters">
        <div class="filter-item">
          <label>页码:</label>
          <input id="pageInput" type="number" min="1" value="1">
        </div>
        <div class="filter-item">
          <label>每页数量:</label>
          <input id="pageSizeInput" type="number" min="1" max="100" value="10">
        </div>
        <div class="filter-item">
          <label>创建时间:</label>
          <input type="date" id="createTime" name="meeting-time">
        </div>
        <button onclick="fetchData()">查询</button>
      </div>

      <div class="data-container">
        <table id="dataTable">
          <thead>
            <tr>
              <th>行数</th>
              <th>IP</th>
              <th>URL</th>
              <th>次数</th>
              <th>更新时间</th>
              <th>创建时间</th>
            </tr>
          </thead>
          <tbody id="tableBody">
          </tbody>
        </table>
      </div>

      <div class="pagination">
        <button id="firstPage" class="page-btn" onclick="goToPage(1)">首页</button>
        <button id="prevPage" class="page-btn" onclick="prevPage()">上一页</button>
        <span id="pageInfo">第 1 页</span>
        <button id="nextPage" class="page-btn" onclick="nextPage()">下一页</button>
        <button id="lastPage" class="page-btn" onclick="goToLastPage()">末页</button>
        <span id="totalCount">共 0 条</span>
      </div>
    </div>

    <script src="../config/config.js"></script>
    <script src="../js/url.js"></script>
  </body>
</html>
