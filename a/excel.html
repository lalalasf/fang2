<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Excel File Manager</title>
    <link rel="stylesheet" href="../css/excel.css">
</head>
<body>
    <!-- Token认证弹窗 -->
    <div id="tokenModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Token Authentication</h2>
            <input type="text" id="tokenInput" class="token-input" placeholder="Enter your token" required>
            <button id="submitToken" class="submit-token">Submit</button>
            <div id="tokenStatus"></div>
        </div>
    </div>

    <div class="upload-section">
        <h1>Upload Excel File</h1>
        <form id="uploadForm" enctype="multipart/form-data">
            <input type="file" id="fileInput" name="file" accept=".xlsx, .xls" required>
            <button type="submit">Upload</button>
        </form>
        <div id="uploadStatus"></div>
    </div>

    <div class="file-list-section">
        <h1>Uploaded Files</h1>
        <ul id="fileList">
            <li>Please authenticate to view files</li>
        </ul>
    </div>

    <script src="../config/config.js"></script>
    <script></script>
</body>
</html>
